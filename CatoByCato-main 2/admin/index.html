<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cato by Cato — CMS</title>
  <!-- Vercel serves /admin without a trailing slash, so Decap's default
       relative fetch of "config.yml" resolves to the site root and 404s.
       This pins the config to its real absolute path. -->
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    var PreviewComponent = createClass({
      render: function() {
        var entry = this.props.entry;
        var get = function(key) { return entry.getIn(['data', key]) || ''; };

        return h('div', { style: {
          fontFamily: 'Georgia, serif',
          padding: '2rem',
          maxWidth: '700px',
          margin: '0 auto',
          color: '#1a1a1a',
          lineHeight: '1.6'
        }},

          h('p', { style: { fontSize: '0.75rem', letterSpacing: '0.1em', textTransform: 'uppercase', color: '#888' }}, '— ' + get('home_hero_location')),

          h('h1', { style: { fontSize: '2rem', margin: '0.5rem 0 1.5rem' }}, get('home_about_heading')),
          h('p', { style: { marginBottom: '2rem' }}, get('home_about_body')),

          h('hr', { style: { border: 'none', borderTop: '1px solid #ddd', margin: '2rem 0' }}),

          h('h2', { style: { fontSize: '1.4rem', marginBottom: '0.5rem' }}, get('home_restaurant_heading')),
          h('p', { style: { marginBottom: '2rem' }}, get('home_restaurant_body')),

          h('hr', { style: { border: 'none', borderTop: '1px solid #ddd', margin: '2rem 0' }}),

          h('h2', { style: { fontSize: '1.4rem', marginBottom: '0.5rem' }}, get('home_garden_heading')),
          h('p', { style: { marginBottom: '2rem' }}, get('home_garden_body')),

          h('hr', { style: { border: 'none', borderTop: '1px solid #ddd', margin: '2rem 0' }}),

          h('h2', { style: { fontSize: '1.4rem', marginBottom: '0.5rem' }}, get('restaurant_hero_heading')),
          h('p', {}, get('restaurant_step1_title')),
          h('p', { style: { color: '#555', fontSize: '0.9rem' }}, get('restaurant_step1_body')),
          h('p', {}, get('restaurant_step2_title')),
          h('p', { style: { color: '#555', fontSize: '0.9rem' }}, get('restaurant_step2_body')),
          h('p', {}, get('restaurant_step3_title')),
          h('p', { style: { color: '#555', fontSize: '0.9rem' }}, get('restaurant_step3_body')),

          h('hr', { style: { border: 'none', borderTop: '1px solid #ddd', margin: '2rem 0' }}),

          h('h2', { style: { fontSize: '1.4rem', marginBottom: '0.5rem' }}, get('catering_hero_heading')),
          h('p', {}, get('catering_what_body')),
          h('p', { style: { fontStyle: 'italic', color: '#555' }}, get('catering_note')),

          h('hr', { style: { border: 'none', borderTop: '1px solid #ddd', margin: '2rem 0' }}),

          h('h2', { style: { fontSize: '1.4rem', marginBottom: '0.5rem' }}, get('garden_hero_heading')),
          h('p', { style: { color: '#888', fontStyle: 'italic' }}, get('garden_hero_sub')),
          h('p', {}, get('garden_origin_body')),

          h('hr', { style: { border: 'none', borderTop: '1px solid #ddd', margin: '2rem 0' }}),

          h('h2', { style: { fontSize: '1.4rem', marginBottom: '0.5rem' }}, get('about_hero_heading')),
          h('p', { style: { fontWeight: 'bold' }}, get('about_cato_name') + ' — ' + get('about_cato_role')),
          h('p', {}, get('about_cato_bio')),
          h('p', { style: { fontStyle: 'italic', fontSize: '1.1rem', borderLeft: '3px solid #ccc', paddingLeft: '1rem' }}, get('about_story_pullquote')),

          h('hr', { style: { border: 'none', borderTop: '1px solid #ddd', margin: '2rem 0' }}),

          h('h2', { style: { fontSize: '1.4rem', marginBottom: '0.5rem' }}, get('contact_hero_heading')),
          h('p', {}, get('contact_hours_monfri') + ': ' + get('contact_hours_monfri_time')),
          h('p', {}, get('contact_hours_sat') + ': ' + get('contact_hours_sat_time')),
          h('p', {}, get('contact_hours_sun') + ': ' + get('contact_hours_sun_time'))
        );
      }
    });

    CMS.registerPreviewTemplate('nl', PreviewComponent);
    CMS.registerPreviewTemplate('en', PreviewComponent);

    // Fotos beheren (images collection) — show a labeled thumbnail grid
    // of every photo slot so it's obvious which picture you're replacing.
    var IMAGE_FIELD_LABELS = {
      home_hero: 'Home: achtergrond (hero)',
      home_familie: 'Home: familie polaroid',
      home_cato: 'Home: Cato polaroid',
      home_seizoen_a: 'Home: seizoensfoto A',
      home_seizoen_b: 'Home: seizoensfoto B',
      home_tuin_1: 'Home: tuin foto 1 (marquee)',
      home_tuin_2: 'Home: tuin foto 2 (marquee)',
      home_tuin_3: 'Home: tuin foto 3 (marquee)',
      home_tuin_4: 'Home: tuin foto 4 (marquee)',
      restaurant_hero: 'Restaurant: achtergrond (hero)',
      catering_hero: 'Catering: achtergrond (hero)',
      catering_1: 'Catering: foto 1 (polaroid)',
      catering_2: 'Catering: foto 2 (polaroid)',
      garden_hero: 'Tuin: achtergrond (hero)',
      garden_origin_1: 'Tuin: oorsprong foto 1',
      garden_origin_2: 'Tuin: oorsprong foto 2',
      garden_gallery_1: 'Tuin: galerij foto 1',
      garden_gallery_2: 'Tuin: galerij foto 2',
      garden_gallery_3: 'Tuin: galerij foto 3',
      garden_gallery_4: 'Tuin: galerij foto 4',
      about_hero: 'Over ons: achtergrond (hero)',
      about_familie_1: 'Over ons: familie foto 1',
      about_familie_2: 'Over ons: familie foto 2',
      about_familie_3: 'Over ons: familie foto 3',
      about_familie_4: 'Over ons: familie foto 4',
      about_familie_5: 'Over ons: familie foto 5',
      about_hond_1: 'Over ons: hond foto 1',
      about_hond_2: 'Over ons: hond foto 2'
    };

    var ImagesPreviewComponent = createClass({
      render: function() {
        var data = this.props.entry.get('data');
        var getAsset = this.props.getAsset;
        var keys = data ? data.keySeq().toArray() : [];

        return h('div', {
          style: {
            fontFamily: 'Georgia, serif',
            padding: '1.5rem',
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fill, minmax(150px, 1fr))',
            gap: '1.25rem'
          }
        },
          keys.map(function(key) {
            var value = data.get(key);
            var label = IMAGE_FIELD_LABELS[key] || key;
            var imgSrc = null;
            if (value) {
              try { imgSrc = getAsset(value).toString(); } catch (e) { imgSrc = null; }
            }
            return h('div', { key: key, style: { textAlign: 'center' } },
              imgSrc
                ? h('img', {
                    src: imgSrc,
                    style: {
                      width: '100%',
                      height: '110px',
                      objectFit: 'cover',
                      borderRadius: '4px',
                      border: '1px solid #ddd',
                      display: 'block'
                    }
                  })
                : h('div', {
                    style: {
                      width: '100%',
                      height: '110px',
                      background: '#eee',
                      borderRadius: '4px',
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      color: '#999',
                      fontSize: '0.7rem'
                    }
                  }, 'Geen foto'),
              h('p', { style: { fontSize: '0.7rem', color: '#555', marginTop: '0.4rem', lineHeight: '1.3' } }, label)
            );
          })
        );
      }
    });
    CMS.registerPreviewTemplate('site_images', ImagesPreviewComponent);
  </script>
</body>
</html>
